{% extends "espacios/base.html" %}
{% block titulo %}Espacio actualizado{% endblock %}
{% block contenido %}
  <div class="confirmacion">
    <div class="icono-exito" aria-hidden="true">✓</div>
    <h1>Espacio actualizado</h1>
    <p class="sub">{{ mensaje }}.</p>
    <div class="espacio centrado">
      <div>
        <strong>{{ espacio.nombre }}</strong>
        <div class="detalle">{{ espacio.tarifa }} · {{ espacio.capacidad }} personas</div>
      </div>
    </div>
    <div class="acciones centradas">
      <a class="boton secundario" href="{% url 'espacios:mis_espacios' %}">Volver a Mis espacios</a>
    </div>
  </div>
{% endblock %}
