<div class="campo{% if campo.errors %} con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required or obligatorio %}<span class="obligatorio">* obligatorio</span>{% endif %}</label>
  {{ campo }}
  {% for error in campo.errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}
  {% if campo.help_text %}<div class="ayuda">{{ campo.help_text|safe }}</div>{% endif %}
</div>
